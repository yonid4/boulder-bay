name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff · mypy · pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Sync dependencies
        run: uv sync --locked --all-groups

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check
        run: uv run mypy app

      - name: Test
        run: uv run pytest

  ios:
    name: iOS (xcodebuild test)
    runs-on: macos-15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      # Runner images change which simulators they ship; pick one rather than
      # hardcoding a device name that silently disappears on the next image bump.
      - name: Pick a simulator
        id: sim
        run: |
          udid=$(xcrun simctl list devices available --json \
            | jq -r '.devices | to_entries[] | select(.key | contains("iOS"))
                     | .value[] | select(.name | startswith("iPhone")) | .udid' \
            | head -1)
          test -n "$udid" || { echo "no iPhone simulator available"; exit 1; }
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Build and test
        env:
          BB_SUPABASE_URL: ${{ vars.BB_SUPABASE_URL }}
          BB_SUPABASE_ANON_KEY: ${{ vars.BB_SUPABASE_ANON_KEY }}
        run: |
          test -n "$BB_SUPABASE_URL" || {
            echo "BB_SUPABASE_URL repository variable is required"
            exit 1
          }
          test -n "$BB_SUPABASE_ANON_KEY" || {
            echo "BB_SUPABASE_ANON_KEY repository variable is required"
            exit 1
          }
          xcodebuild test \
            -project BoulderBay.xcodeproj \
            -scheme BoulderBay \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO \
            BB_SUPABASE_URL="$BB_SUPABASE_URL" \
            BB_SUPABASE_ANON_KEY="$BB_SUPABASE_ANON_KEY" \
            -quiet
