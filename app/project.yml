name: BoulderBay

options:
  bundleIdPrefix: com.boulderbay
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0

targets:
  BoulderBay:
    type: application
    platform: iOS
    sources:
      - path: BoulderBay
        excludes:
          - "**/.gitkeep"
          - "Core/Networking/Mock/Logos"
      # The twelve gym marks MockAPIClient serves as file:// URLs, copied into the
      # bundle as a Logos/ folder so they stay namespaced (Logos/mission.png).
      - path: BoulderBay/Core/Networking/Mock/Logos
        type: folder
        buildPhase: resources
    dependencies:
      - package: Supabase
        product: Supabase
    # App.xcconfig (committed) optionally includes Supabase.xcconfig (gitignored),
    # which holds the Supabase URL + anon key — see Config/Supabase.example.xcconfig.
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    info:
      path: BoulderBay/Resources/Info.plist
      properties:
        CFBundleDisplayName: Boulder Bay
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Light
        # The dev backend is plain HTTP on localhost / the Mac's LAN IP.
        # Simulator reaches it via localhost; a device needs the LAN exception.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: true
        # Overridable per-scheme so a device build can point at the LAN IP.
        BBAPIBaseURL: $(BB_API_BASE_URL)
        # Supabase Auth, for the supabase-swift client. Both come from
        # Config/Supabase.xcconfig (gitignored); an undefined build setting
        # expands to "" here and AppConfig reads that as "not configured".
        BBSupabaseURL: $(BB_SUPABASE_URL)
        BBSupabaseAnonKey: $(BB_SUPABASE_ANON_KEY)
        # Whether the app serves data from the in-app MockAPIClient instead of
        # the FastAPI backend. Debug defaults to YES; override for one run with
        # the launch argument `-BBUseMockAPI NO` in the scheme.
        BBUseMockAPI: $(BB_USE_MOCK_API)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.boulderbay.BoulderBay
        GENERATE_INFOPLIST_FILE: NO
        BB_API_BASE_URL: http://localhost:8000
        # BB_SUPABASE_URL / BB_SUPABASE_ANON_KEY are deliberately NOT set here:
        # a value in this block would override the xcconfig, not default it.
      configs:
        Debug:
          BB_USE_MOCK_API: "YES"
        Release:
          BB_USE_MOCK_API: "NO"

  BoulderBayTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BoulderBayTests
        excludes:
          - "**/.gitkeep"
    dependencies:
      - target: BoulderBay
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.boulderbay.BoulderBayTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  BoulderBay:
    build:
      targets:
        BoulderBay: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - BoulderBayTests
