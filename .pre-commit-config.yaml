default_install_hook_types: [pre-commit, pre-push]
# The design mockup is a generated export — never reformat it.
exclude: '^(app/BoulderBay\.xcodeproj/|Boulder Bay\.html$)'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=2048]
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  - repo: local
    hooks:
      - id: backend-ci
        name: backend (ruff · mypy · pytest)
        entry: >-
          bash -c 'cd backend &&
          uv run ruff check . &&
          uv run ruff format --check . &&
          uv run mypy app &&
          uv run pytest'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: ios-ci
        name: iOS (xcodebuild test)
        entry: >-
          bash -c 'cd app &&
          xcodegen generate &&
          udid=$(xcrun simctl list devices available --json |
          jq -r ".devices | to_entries[] | select(.key | contains(\"iOS\")) |
          .value[] | select(.name | startswith(\"iPhone\")) | .udid" |
          head -1) &&
          test -n "$udid" &&
          xcodebuild test
          -project BoulderBay.xcodeproj
          -scheme BoulderBay
          -destination "id=$udid"
          CODE_SIGNING_ALLOWED=NO
          -quiet'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
